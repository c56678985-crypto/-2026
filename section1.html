
<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>பிரிவு 1 | யோனா வினாடி வினா 2026</title>

<link rel="stylesheet" href="css/style.css">
<script src="js/questions.js"></script>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:#08152d;
color:white;
}

header{
background:linear-gradient(90deg,#FFD700,#C9A227);
padding:18px;
text-align:center;
font-size:24px;
font-weight:bold;
color:#000;
}

.container{
width:90%;
max-width:900px;
margin:25px auto;
}

.progress{
height:15px;
background:#444;
border-radius:20px;
overflow:hidden;
margin-bottom:20px;
}

.bar{
height:100%;
width:0%;
background:#00ff99;
}

.card{

background:#12284d;
padding:25px;
border-radius:15px;

}

.questionNo{

font-size:20px;
color:gold;

}

.question{

font-size:22px;
margin-top:20px;
line-height:35px;

}

.option{

background:#1e3c72;

padding:15px;

margin-top:15px;

border-radius:10px;

cursor:pointer;

transition:.3s;

}

.option:hover{

background:#28559d;

}

.buttons{

display:flex;

gap:15px;

margin-top:25px;

}

.wait{

flex:1;

background:orange;

color:white;

border:none;

padding:15px;

border-radius:10px;

font-size:18px;

}

.submit{

flex:1;

background:#00b050;

color:white;

border:none;

padding:15px;

border-radius:10px;

font-size:18px;

}

.reference{

margin-top:20px;

color:#ffd966;

}

.status{

margin-top:25px;

display:flex;

justify-content:space-between;

font-size:18px;

}

</style>

</head>

<body>

<header>

யோனா வினாடி வினா 2026

</header>

<div class="container">

<div class="progress">

<div class="bar" id="bar"></div>

</div>

<div class="card">

<div class="questionNo">

கேள்வி 1 / 10

</div>

<div class="question" id="question">

Loading...

</div>

<div id="options">

</div>

<div class="buttons">

<button class="wait">

🟡 Waiting

</button>

<button class="submit">

✅ Submit

</button>

</div>

<div class="reference" id="reference">

📖 அதிகாரம்

</div>

<div class="status">

<div>

Completed : 0

</div>

<div>

Waiting : 0

</div>

<div>

Remaining : 10

</div>

</div>

</div>

</div>
  
  <script src="js/quiz.js"></script>

</body>

</html>
